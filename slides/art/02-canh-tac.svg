<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="24" fill="url(#g2)"/>
  <!-- Sun and hills -->
  <circle cx="480" cy="90" r="45" fill="#fef08a" opacity="0.9"/>
  <path d="M0,260 Q150,200 320,240 T600,220 L600,400 L0,400 Z" fill="#15803d"/>
  <path d="M0,300 Q180,260 360,290 T600,270 L600,400 L0,400 Z" fill="#166534"/>
  <!-- Farmland Furrows -->
  <path d="M80,340 Q250,310 520,330" stroke="#86efac" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M120,370 Q280,345 480,365" stroke="#86efac" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
  <!-- Growing Sprout -->
  <g transform="translate(240, 220)">
    <path d="M0,40 Q-30,0 -40,-35 Q-10,-45 0,-10 Q10,-45 40,-35 Q30,0 0,40 Z" fill="#4ade80"/>
    <line x1="0" y1="40" x2="0" y2="70" stroke="#854d0e" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Buffer Zone & Badge -->
  <g transform="translate(100, 80)">
    <rect width="180" height="70" rx="12" fill="#ffffff" opacity="0.95"/>
    <text x="90" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">CHUYỂN ĐỔI</text>
    <text x="90" y="55" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#b45309" text-anchor="middle">≥ 2 - 3 NĂM</text>
  </g>
  <g transform="translate(320, 80)">
    <rect width="180" height="70" rx="12" fill="#ffffff" opacity="0.95"/>
    <text x="90" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">NGUỒN GIỐNG</text>
    <text x="90" y="55" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#15803d" text-anchor="middle">NON-GMO</text>
  </g>
</svg>