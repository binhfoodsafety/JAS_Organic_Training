<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="600" height="400" rx="24" fill="url(#g1)"/>
  <!-- Central Badge -->
  <g filter="url(#shadow)" transform="translate(300,180)">
    <circle r="110" fill="#ffffff" stroke="#34d399" stroke-width="8"/>
    <circle r="92" fill="#ecfdf5"/>
    <!-- Organic Leaf Motif -->
    <path d="M-40,40 C-60,-20 -20,-70 20,-80 C30,-30 10,20 -40,40 Z" fill="#10b981"/>
    <path d="M10,35 C40,-10 60,-40 50,-70 C25,-60 10,-20 10,35 Z" fill="#34d399"/>
    <path d="M-30,45 Q-5,0 15,-75" stroke="#065f46" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- JAS Text Banner -->
    <rect x="-65" y="45" width="130" height="40" rx="8" fill="#d97706"/>
    <text x="0" y="72" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">JAS</text>
  </g>
  <!-- Orbiting Nodes -->
  <g transform="translate(140, 110)">
    <circle r="36" fill="#10b981" filter="url(#shadow)"/>
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">MAFF</text>
  </g>
  <g transform="translate(460, 110)">
    <circle r="36" fill="#10b981" filter="url(#shadow)"/>
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">CB (Tổ chức)</text>
  </g>
  <g transform="translate(140, 270)">
    <circle r="36" fill="#10b981" filter="url(#shadow)"/>
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Trang trại</text>
  </g>
  <g transform="translate(460, 270)">
    <circle r="36" fill="#10b981" filter="url(#shadow)"/>
    <text x="0" y="6" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Nhà máy</text>
  </g>
  <!-- Connecting dashed lines -->
  <path d="M176,110 L230,140" stroke="#a7f3d0" stroke-width="3" stroke-dasharray="6,6"/>
  <path d="M424,110 L370,140" stroke="#a7f3d0" stroke-width="3" stroke-dasharray="6,6"/>
  <path d="M176,270 L230,220" stroke="#a7f3d0" stroke-width="3" stroke-dasharray="6,6"/>
  <path d="M424,270 L370,220" stroke="#a7f3d0" stroke-width="3" stroke-dasharray="6,6"/>
  <!-- Subtitle -->
  <text x="300" y="360" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0" text-anchor="middle">HỆ THỐNG CHỨNG NHẬN TIÊU CHUẨN NÔNG NGHIỆP NHẬT BẢN</text>
</svg>