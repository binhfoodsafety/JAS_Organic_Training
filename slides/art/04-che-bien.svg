<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="24" fill="url(#g4)"/>
  <!-- Factory & Conveyor -->
  <g transform="translate(160, 200)">
    <!-- Mixing / Processing tank -->
    <rect x="-60" y="-80" width="120" height="150" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="5"/>
    <rect x="-50" y="-10" width="100" height="70" rx="8" fill="#3b82f6"/>
    <!-- Gear icon -->
    <circle cx="0" cy="-40" r="18" fill="#cbd5e1"/>
    <text x="0" y="105" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">Chế biến cơ học / vật lý</text>
  </g>
  <!-- Percentage 95% Badge -->
  <g transform="translate(420, 190)">
    <circle r="90" fill="#ffffff" stroke="#60a5fa" stroke-width="8"/>
    <circle r="76" fill="#eff6ff"/>
    <text x="0" y="-10" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e40af" text-anchor="middle">NGUYÊN LIỆU HỮU CƠ</text>
    <text x="0" y="45" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="#2563eb" text-anchor="middle">≥ 95%</text>
  </g>
  <text x="300" y="60" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">TIÊU CHUẨN THỰC PHẨM CHẾ BIẾN (JAS 1606)</text>
</svg>